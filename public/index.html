<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Planning</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #eaedf1; margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    h1 { text-align: center; color: #2c3e50; margin-top: 0; font-size: 20px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-name { font-size: 12px; color: #7f8c8d; font-weight: bold; padding-bottom: 4px; }
    .day-num { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; background: #f8f9fa; color: #333; font-size: 14px; cursor: pointer; position: relative; }
    .day-num:active { transform: scale(0.95); }
    .other-month { opacity: 0.3; cursor: default; }
    .modified { border: 2px solid #e67e22; box-sizing: border-box; }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin-top: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .color-box { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
    
    /* Fenêtre Modale */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 320px; display: grid; gap: 12px; }
    .modal-content h3 { margin: 0 0 5px 0; color: #2c3e50; font-size: 18px; }
    select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
    .btn-save { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-close { background: #95a5a6; color: white; border: none; font-weight: bold; cursor: pointer; }
    .checkbox-container { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .checkbox-container input { width: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Août 2026</h1>
      <div class="calendar-grid" id="grid"></div>
    </div>

    <div class="card">
      <strong>Légende</strong>
      <div class="legend-grid">
        <div class="legend-item"><div class="color-box" style="background:#3498db"></div>7h00 - 13h30</div>
        <div class="legend-item"><div class="color-box" style="background:#2ecc71"></div>8h00 - 15h30</div>
        <div class="legend-item"><div class="color-box" style="background:#1abc9c"></div>9h00 - 16h30</div>
        <div class="legend-item"><div class="color-box" style="background:#9b59b6"></div>13h30 - 21h00</div>
        <div class="legend-item"><div class="color-box" style="background:#2c3e50"></div>20h45 - 7h15</div>
        <div class="legend-item"><div class="color-box" style="background:#95a5a6"></div>Repos</div>
        <div class="legend-item"><div class="color-box" style="background:#f1c40f"></div>Vacances</div>
      </div>
    </div>
  </div>

  <!-- Modale de sélection -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalDateTitle">Modifier le jour</h3>
      <select id="modalShiftType">
        <option value="7h00-13h30">7h00 - 13h30</option>
        <option value="8h00-15h30">8h00 - 15h30</option>
        <option value="9h00-16h30">9h00 - 16h30</option>
        <option value="13h30-21h00">13h30 - 21h00</option>
        <option value="20h45-7h15">20h45 - 7h15</option>
        <option value="Repos">Repos</option>
        <option value="Vacances">Vacances</option>
      </select>
      <div class="checkbox-container">
        <input type="checkbox" id="modalIsModified">
        <label for="modalIsModified">Modifié (Contour Orange)</label>
      </div>
      <button class="btn-save" id="btnSave">Enregistrer</button>
      <button class="btn-close" id="btnClose">Annuler</button>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalDateTitle = document.getElementById('modalDateTitle');
    const modalShiftType = document.getElementById('modalShiftType');
    const modalIsModified = document.getElementById('modalIsModified');
    const btnSave = document.getElementById('btnSave');
    const btnClose = document.getElementById('btnClose');

    const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const colorMap = {
      "7h00-13h30": "#3498db",
      "8h00-15h30": "#2ecc71",
      "9h00-16h30": "#1abc9c",
      "13h30-21h00": "#9b59b6",
      "20h45-7h15": "#2c3e50",
      "Repos": "#95a5a6",
      "Vacances": "#f1c40f"
    };

    let selectedDateStr = '';

    async function load() {
      grid.innerHTML = '';
      days.forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);

      // Décalage pour août 2026 (commence un samedi -> 5 jours vides)
      for(let i=1; i<6; i++) {
        grid.innerHTML += `<div class="day-num other-month">${26+i}</div>`;
      }

      // Jours du mois d'août
      for(let i=1; i<=31; i++) {
        const dStr = `2026-08-${String(i).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-num';
        cell.id = `d-${dStr}`;
        cell.innerHTML = `<span>${i}</span>`;
        
        // Clic sur un jour pour ouvrir la modale
        cell.addEventListener('click', () => {
          selectedDateStr = dStr;
          modalDateTitle.innerText = `Le ${i} Août 2026`;
          modal.style.display = 'flex';
        });

        grid.appendChild(cell);
      }

      try {
        const res = await fetch('/api/schedules');
        const data = await res.json();
        data.forEach(item => {
          const el = document.getElementById(`d-${item.date}`);
          if(el) {
            el.style.backgroundColor = colorMap[item.shift_type] || '#bdc3c7';
            if(item.shift_type === "20h45-7h15" || item.shift_type === "13h30-21h00") {
              el.style.color = 'white';
            }
            if(item.is_modified) {
              el.classList.add('modified');
            }
          }
        });
      } catch(err) {
        console.log("Erreur chargement planning");
      }
    }

    // Fermer la modale
    btnClose.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // Enregistrer depuis la modale
    btnSave.addEventListener('click', async () => {
      await fetch('/api/schedules', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          date: selectedDateStr,
          shiftType: modalShiftType.value,
          isModified: modalIsModified.checked
        })
      });
      modal.style.display = 'none';
      load();
    });

    load();
  </script>
</body>
</html>
