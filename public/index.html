<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Planning</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f8fa;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            color: #f59e0b;
            cursor: pointer;
            padding: 5px 10px;
        }
        .calendar-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            background-color: #f1f2f6;
            color: #333;
        }
        .day.other-month {
            color: #c7c7cc;
            background-color: transparent;
        }
        /* Couleurs du planning */
        .shift-7-14 { background-color: #9333ea !important; color: white !important; }
        .shift-8-15 { background-color: #a5f3fc !important; color: #1e293b !important; }
        .shift-9-16 { background-color: #fde68a !important; color: #1e293b !important; }
        .shift-13-21 { background-color: #fbcfe8 !important; color: #1e293b !important; }
        .shift-repos { background-color: #86efac !important; color: #1e293b !important; }
        .shift-vacances { background-color: #e879f9 !important; color: white !important; }

        .legend-toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }
        /* Style du Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(22px); }

        .legend-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Calendrier -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#10094;</button>
            <h2 id="month-year-display">August 2026</h2>
            <button onclick="changeMonth(1)">&#10095;</button>
        </div>
        <div class="weekdays">
            <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
        </div>
        <div class="days-grid" id="days-container"></div>
    </div>

    <!-- Légende avec Switch -->
    <div class="card">
        <div class="legend-toggle-container">
            <span>Affichage permanent de la légende</span>
            <label class="switch">
                <input type="checkbox" id="legendToggle" checked onchange="toggleLegend()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="legend-box" id="legendBox">
            <div class="legend-item"><div class="legend-color" style="background:#9333ea;"></div>7h00 - 14h30</div>
            <div class="legend-item"><div class="legend-color" style="background:#a5f3fc;"></div>8h00 - 15h30</div>
            <div class="legend-item"><div class="legend-color" style="background:#fde68a;"></div>9h00 - 16h30</div>
            <div class="legend-item"><div class="legend-color" style="background:#fbcfe8;"></div>13h30 - 21h00</div>
            <div class="legend-item"><div class="legend-color" style="background:#86efac;"></div>Repos</div>
            <div class="legend-item"><div class="legend-color" style="background:#e879f9;"></div>Vacances</div>
        </div>
    </div>

    <script>
        let currentDate = new Date(2026, 7, 1); // Août 2026 par défaut

        // Simulation d'un planning type (tu pourras l'adapter ou le lier à une logique de cycle)
        // Les clés sont au format "YYYY-MM-DD"
        const sampleSchedule = {
            "2026-08-01": "shift-repos",
            "2026-08-02": "shift-13-21",
            "2026-08-03": "shift-9-16",
            "2026-08-04": "shift-7-14",
            "2026-08-05": "shift-repos",
            "2026-08-06": "shift-8-15",
            "2026-08-07": "shift-13-21",
            "2026-08-08": "shift-repos",
            "2026-08-09": "shift-7-14",
            "2026-08-10": "shift-13-21",
            "2026-08-11": "shift-9-16",
            "2026-08-12": "shift-13-21",
            "2026-08-13": "shift-7-14",
            "2026-08-14": "shift-7-14",
            "2026-08-15": "shift-9-16",
            "2026-08-16": "shift-13-21",
            "2026-08-17": "shift-7-14",
            "2026-08-18": "shift-7-14",
            "2026-08-19": "shift-7-14",
            "2026-08-20": "shift-13-21",
            "2026-08-21": "shift-9-16",
            "2026-08-22": "shift-13-21",
            "2026-08-23": "shift-13-21",
            "2026-08-24": "shift-7-14",
            "2026-08-25": "shift-9-16",
            "2026-08-26": "shift-9-16",
            "2026-08-27": "shift-7-14",
            "2026-08-28": "shift-13-21",
            "2026-08-29": "shift-13-21",
            "2026-08-30": "shift-8-15",
            "2026-08-31": "shift-repos"
        };

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("month-year-display").innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Lundi comme premier jour
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            const container = document.getElementById("days-container");
            container.innerHTML = "";

            // Jours du mois précédent
            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day other-month";
                dayDiv.innerText = prevTotalDays - i + 1;
                container.appendChild(dayDiv);
            }

            // Jours du mois en cours
            for (let i = 1; i <= totalDays; i++) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day";
                dayDiv.innerText = i;

                // Format de date YYYY-MM-DD pour vérifier s'il y a une couleur associée
                const monthFormatted = String(month + 1).padStart(2, '0');
                const dayFormatted = String(i).padStart(2, '0');
                const dateKey = `${year}-${monthFormatted}-${dayFormatted}`;

                if (sampleSchedule[dateKey]) {
                    dayDiv.classList.add(sampleSchedule[dateKey]);
                }

                container.appendChild(dayDiv);
            }

            // Jours du mois suivant pour compléter la grille
            const totalCellsDisplayed = firstDayIndex + totalDays;
            const nextDaysCount = (totalCellsDisplayed % 7 === 0) ? 0 : 7 - (totalCellsDisplayed % 7);
            for (let i = 1; i <= nextDaysCount; i++) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day other-month";
                dayDiv.innerText = i;
                container.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function toggleLegend() {
            const box = document.getElementById("legendBox");
            const toggle = document.getElementById("legendToggle");
            if (toggle.checked) {
                box.classList.remove("hidden");
            } else {
                box.classList.add("hidden");
            }
        }

        // Lancement au démarrage
        renderCalendar();
    </script>
</body>
</html>
