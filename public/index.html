<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Planning</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f8fa;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            color: #f59e0b;
            cursor: pointer;
            padding: 5px 10px;
        }
        .calendar-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            background-color: #f1f2f6;
            color: #333;
            cursor: pointer;
        }
        .day.other-month {
            color: #c7c7cc;
            background-color: transparent;
            cursor: default;
        }

        /* Couleurs pleines des cases du calendrier */
        .shift-7-14 { background-color: #9333ea !important; color: white !important; }
        .shift-8-15 { background-color: #a5f3fc !important; color: #1e293b !important; }
        .shift-9-16 { background-color: #fde68a !important; color: #1e293b !important; }
        .shift-10-18 { background-color: #fed7aa !important; color: #1e293b !important; }
        .shift-13-21 { background-color: #fbcfe8 !important; color: #1e293b !important; }
        .shift-2045-715 { background-color: #1e1b4b !important; color: white !important; }
        .shift-repos { background-color: #86efac !important; color: #1e293b !important; }
        .shift-vacances { background-color: #e879f9 !important; color: white !important; }

        .legend-toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(22px); }

        .legend-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .hidden { display: none !important; }

        /* Fenêtre Modale avec le menu déroulant complet au clic */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; font-size: 16px; margin-bottom: 15px; color: #1e293b; }
        
        .modal select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-save { background-color: #3b82f6; color: white; }
        .btn-clear { background-color: #ef4444; color: white; }
        .btn-close { background-color: #e2e8f0; color: #475569; width: 100%; margin-top: 8px; }
    </style>
</head>
<body>

    <!-- Calendrier -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#10094;</button>
            <h2 id="month-year-display">August 2026</h2>
            <button onclick="changeMonth(1)">&#10095;</button>
        </div>
        <div class="weekdays">
            <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
        </div>
        <div class="days-grid" id="days-container"></div>
    </div>

    <!-- Légende avec Switch -->
    <div class="card">
        <div class="legend-toggle-container">
            <span>Affichage permanent de la légende</span>
            <label class="switch">
                <input type="checkbox" id="legendToggle" checked onchange="toggleLegend()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="legend-box" id="legendBox">
            <div class="legend-item"><div class="legend-color" style="background:#9333ea;"></div>7h00 - 14h30</div>
            <div class="legend-item"><div class="legend-color" style="background:#a5f3fc;"></div>8h00 - 15h30</div>
            <div class="legend-item"><div class="legend-color" style="background:#fde68a;"></div>9h00 - 16h30</div>
            <div class="legend-item"><div class="legend-color" style="background:#fed7aa;"></div>10h00 - 18h00</div>
            <div class="legend-item"><div class="legend-color" style="background:#fbcfe8;"></div>13h30 - 21h00</div>
            <div class="legend-item"><div class="legend-color" style="background:#1e1b4b;"></div>20h45 - 7h15</div>
            <div class="legend-item"><div class="legend-color" style="background:#86efac;"></div>Repos</div>
            <div class="legend-item"><div class="legend-color" style="background:#e879f9;"></div>Vacances</div>
        </div>
    </div>

    <!-- Fenêtre Modale avec menu déroulant -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalDateTitle">Modifier le jour</h3>
            <select id="shiftSelect">
                <option value="">Sélectionner un horaire...</option>
                <option value="shift-7-14">7h00 - 14h30</option>
                <option value="shift-8-15">8h00 - 15h30</option>
                <option value="shift-9-16">9h00 - 16h30</option>
                <option value="shift-10-18">10h00 - 18h00</option>
                <option value="shift-13-21">13h30 - 21h00</option>
                <option value="shift-2045-715">20h45 - 7h15</option>
                <option value="shift-repos">Repos</option>
                <option value="shift-vacances">Vacances</option>
            </select>
            <div class="modal-actions">
                <button class="modal-btn btn-save" onclick="saveShift()">Valider</button>
                <button class="modal-btn btn-clear" onclick="clearShift()">Effacer</button>
            </div>
            <button class="modal-btn btn-close" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        let currentDate = new Date(2026, 7, 1);
        let scheduleData = JSON.parse(localStorage.getItem('monPlanningData')) || {};
        let selectedDateKey = "";

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("month-year-display").innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            const container = document.getElementById("days-container");
            container.innerHTML = "";

            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day other-month";
                dayDiv.innerText = prevTotalDays - i + 1;
                container.appendChild(dayDiv);
            }

            for (let i = 1; i <= totalDays; i++) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day";
                dayDiv.innerText = i;

                const monthFormatted = String(month + 1).padStart(2, '0');
                const dayFormatted = String(i).padStart(2, '0');
                const dateKey = `${year}-${monthFormatted}-${dayFormatted}`;

                if (scheduleData[dateKey]) {
                    dayDiv.classList.add(scheduleData[dateKey]);
                }

                dayDiv.onclick = () => openModal(dateKey, i, monthNames[month], year);
                container.appendChild(dayDiv);
            }

            const totalCellsDisplayed = firstDayIndex + totalDays;
            const nextDaysCount = (totalCellsDisplayed % 7 === 0) ? 0 : 7 - (totalCellsDisplayed % 7);
            for (let i = 1; i <= nextDaysCount; i++) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day other-month";
                dayDiv.innerText = i;
                container.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function toggleLegend() {
            const box = document.getElementById("legendBox");
            const toggle = document.getElementById("legendToggle");
            if (toggle.checked) {
                box.classList.remove("hidden");
            } else {
                box.classList.add("hidden");
            }
        }

        function openModal(dateKey, dayNum, monthName, year) {
            selectedDateKey = dateKey;
            document.getElementById("modalDateTitle").innerText = `Horaire pour le ${dayNum} ${monthName} ${year}`;
            document.getElementById("shiftSelect").value = scheduleData[dateKey] || "";
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function saveShift() {
            const selectedValue = document.getElementById("shiftSelect").value;
            if (selectedValue) {
                scheduleData[selectedDateKey] = selectedValue;
            } else {
                delete scheduleData[selectedDateKey];
            }
            localStorage.setItem('monPlanningData', JSON.stringify(scheduleData));
            closeModal();
            renderCalendar();
        }

        function clearShift() {
            delete scheduleData[selectedDateKey];
            localStorage.setItem('monPlanningData', JSON.stringify(scheduleData));
            closeModal();
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
